plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    // Jackson YAML & Databind for YAML-first definitions and schema processing
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
    implementation 'org.yaml:snakeyaml:2.2'

    additionalRuntimeClasspath 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.2'
    additionalRuntimeClasspath 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    additionalRuntimeClasspath 'com.fasterxml.jackson.core:jackson-core:2.17.2'
    additionalRuntimeClasspath 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
    additionalRuntimeClasspath 'org.yaml:snakeyaml:2.2'

    jarJar(implementation('com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.2'))
    jarJar(implementation('com.fasterxml.jackson.core:jackson-databind:2.17.2'))
    jarJar(implementation('com.fasterxml.jackson.core:jackson-core:2.17.2'))
    jarJar(implementation('com.fasterxml.jackson.core:jackson-annotations:2.17.2'))
    jarJar(implementation('org.yaml:snakeyaml:2.2'))

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation files(sourceSets.main.compileClasspath)
    testRuntimeOnly files(sourceSets.main.runtimeClasspath)
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}


