name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Enforce Documentation Truth Gate
        run: python tools/parity/check_truth_gate.py

      - name: Validate Parity Evidence and Fixture Catalog
        run: python -m unittest discover -s tools/parity -p "test_*.py"

      - name: Run StoryNPCs Fixture Suite (declared blockers stay blocked)
        run: python tools/parity/run_storynpcs_fixtures.py --ci-allow-declared-blockers

      - name: Build Mod Jar
        run: ./gradlew build --stacktrace

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-reports
          path: |
            build/reports/tests/test/
            build/reports/parity/

      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: storynpcs-jar
          path: build/libs/*.jar
